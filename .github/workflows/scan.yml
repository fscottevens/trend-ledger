name: Scheduled scan

on:
  # Runs every 15 minutes, 13:00-21:00 UTC, Mon-Fri. That's roughly
  # 9am-5pm ET, but UTC doesn't shift for US daylight saving, so during
  # EDT (Mar-Nov) this covers ~9:00am-5:00pm ET, and during EST (Nov-Mar)
  # it drifts an hour later to ~8:00am-4:00pm ET. Adjust the two hour
  # numbers below if you want tighter alignment for your part of the year.
  #
  # 15-minute cadence = up to 36 runs/day, ~180/week. Public repos get
  # unlimited free GitHub Actions minutes, so this isn't a cost concern -
  # the real constraint is runtime: a full ~900-ticker scan can itself
  # take several minutes. The concurrency block below makes sure a new
  # run never starts while a previous one is still pushing, so overlapping
  # triggers queue safely rather than colliding - if a scan ever runs
  # long, you'll just see slightly-less-than-15-minute-fresh data rather
  # than anything breaking.
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  # Lets you trigger a run manually from the Actions tab any time.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python sepa_scanner.py --json-out docs/data/latest.json
        # No continue-on-error here on purpose: an earlier version of this
        # workflow suppressed failures to avoid noisy emails for the rare
        # transient Yahoo Finance rate-limit hiccup, but that also meant
        # a run that failed EVERY time would still show green with no
        # visible signal anything was wrong - which is exactly how this
        # site went stale for days without anyone noticing. Now with runs
        # every 15 minutes, an occasional single failed run costs almost
        # nothing (the next one fires 15 minutes later) - so it's a much
        # better trade to let genuine failures show as a red X (and, by
        # GitHub's default behavior, an email) than to hide them.

      - name: Commit updated data
        run: |
          git config user.name "trend-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/latest.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Scheduled scan update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
