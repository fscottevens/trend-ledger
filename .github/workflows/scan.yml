name: Scheduled scan

on:
  # ---------------------------------------------------------------------
  # Runs hourly during US market hours, weekdays.
  #
  # WHY MINUTE :17 AND NOT :00 --- this is deliberate and matters.
  # GitHub's own documentation states: "The schedule event can be delayed
  # during periods of high loads of GitHub Actions workflow runs. High load
  # times include THE START OF EVERY HOUR. If the load is sufficiently high
  # enough, some queued jobs may be dropped. To decrease the chance of
  # delay, schedule your workflow to run at a different time of the hour."
  #
  # Scheduling at :00 puts this job in the single most contended slot on
  # GitHub's global scheduler, where public-repo jobs are deprioritised and
  # can be delayed by hours or dropped outright. Running at :17 gives the
  # same once-per-hour cadence with a materially better chance of actually
  # firing on time. If you ever want to move it, pick any minute that is
  # not 0, 15, 30 or 45 --- those are the crowded ones.
  #
  # 13:00-21:00 UTC is roughly 9am-5pm ET. UTC does not shift for US
  # daylight saving, so this window drifts by an hour between EDT and EST.
  # ---------------------------------------------------------------------
  schedule:
    - cron: "17 13-21 * * 1-5"
  # Lets you trigger a run manually from the Actions tab at any time.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python sepa_scanner.py --json-out docs/data/latest.json
        # No continue-on-error here, on purpose. An earlier version of this
        # workflow suppressed failures to avoid email noise from occasional
        # Yahoo Finance rate limiting --- but that also meant a scan failing
        # every single time still reported success, so the site could go
        # stale for days with nothing visibly wrong. A genuine failure
        # should be a red X you can see.

      - name: Commit updated data
        run: |
          git config user.name "stonks-run-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/latest.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Scheduled scan update $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Rebase before pushing: if a manual run and a scheduled run finish
          # close together, or you pushed site edits mid-scan, a plain push
          # would be rejected and the scan's data would be silently lost.
          git pull --rebase --autostash origin main
          git push
